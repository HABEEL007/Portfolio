<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#0B1A2C"/>
    </linearGradient>
    <linearGradient id="medCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="medGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#medBg)" rx="16"/>

  <pattern id="medGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" fill="url(#medGrid)" rx="16"/>

  <circle cx="400" cy="240" r="140" fill="#06B6D4" opacity="0.1" filter="url(#medGlow)"/>

  <!-- Brain / MRI Scan Contour & Wave Visualization -->
  <g transform="translate(400, 240)">
    <!-- Brain outline contours -->
    <path d="M -80 -20 C -90 -70, -40 -110, 0 -110 C 40 -110, 90 -70, 80 -20 C 95 30, 60 90, 0 100 C -60 90, -95 30, -80 -20 Z" 
          fill="none" stroke="url(#medCyan)" stroke-width="2" opacity="0.8"/>
    <path d="M -60 -15 C -70 -55, -30 -85, 0 -85 C 30 -85, 70 -55, 60 -15 C 70 25, 45 70, 0 75 C -45 70, -70 25, -60 -15 Z" 
          fill="rgba(6, 182, 212, 0.06)" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="6 4"/>
    
    <!-- Midline and neural lobes -->
    <line x1="0" y1="-100" x2="0" y2="85" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Grad-CAM Highlight Anomaly -->
    <circle cx="35" cy="-30" r="30" fill="#EC4899" opacity="0.4" filter="url(#medGlow)"/>
    <circle cx="35" cy="-30" r="18" fill="#F59E0B" opacity="0.6" filter="url(#medGlow)"/>
    <circle cx="35" cy="-30" r="6" fill="#FFFFFF"/>
    <circle cx="35" cy="-30" r="38" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Pulse ECG Line -->
    <path d="M -180 50 L -100 50 L -80 20 L -60 80 L -40 30 L -20 50 L 180 50" fill="none" stroke="#10B981" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Badges -->
  <rect x="50" y="45" width="135" height="28" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
  <circle cx="66" cy="59" r="4" fill="#06B6D4"/>
  <text x="78" y="63" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">MEDICAL AI LAB</text>

  <rect x="580" y="45" width="170" height="28" rx="6" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1"/>
  <text x="595" y="63" fill="#F472B6" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">GRAD-CAM EXPLAIN</text>

  <text x="50" y="430" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">Medical AI Research</text>
  <text x="50" y="455" fill="#94A3B8" font-family="sans-serif" font-size="13">MRI Diagnostic Models · Health NLP Chatbot · Early Wildfire Detection</text>
</svg>
