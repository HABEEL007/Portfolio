<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0D1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Tech Grid Background -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" fill="url(#grid)" rx="16"/>

  <!-- Ambient Glows -->
  <circle cx="400" cy="250" r="160" fill="#3B82F6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="280" cy="220" r="100" fill="#8B5CF6" opacity="0.1" filter="url(#glow)"/>

  <!-- Biometric Face / Scan HUD -->
  <g transform="translate(400, 240)">
    <!-- Outer HUD ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#cyanBlue)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="18 12" opacity="0.5"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Corner Target Reticles -->
    <path d="M -110 -80 L -110 -110 L -80 -110" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <path d="M 110 -80 L 110 -110 L 80 -110" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <path d="M -110 80 L -110 110 L -80 110" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <path d="M 110 80 L 110 110 L 80 110" fill="none" stroke="#38BDF8" stroke-width="3"/>

    <!-- Neural Face Mesh Geometry -->
    <polygon points="0,-70 -35,-30 35,-30" fill="none" stroke="url(#cyanBlue)" stroke-width="1.5" opacity="0.8"/>
    <polygon points="-35,-30 0,10 35,-30" fill="none" stroke="url(#purpleGrad)" stroke-width="1.5" opacity="0.8"/>
    <polygon points="-35,-30 -50,20 -15,50 0,10" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.2"/>
    <polygon points="35,-30 50,20 15,50 0,10" fill="none" stroke="rgba(139, 92, 246, 0.6)" stroke-width="1.2"/>
    <polygon points="-15,50 0,75 15,50 0,10" fill="none" stroke="url(#cyanBlue)" stroke-width="1.5"/>

    <!-- Iris & Facial Feature Points -->
    <circle cx="-25" cy="-25" r="5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="25" cy="-25" r="5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="0" cy="15" r="4" fill="#8B5CF6"/>
    <circle cx="-15" cy="50" r="3.5" fill="#38BDF8"/>
    <circle cx="15" cy="50" r="3.5" fill="#38BDF8"/>
    <circle cx="0" cy="75" r="4" fill="#10B981" filter="url(#glow)"/>

    <!-- Live Scan Line -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#38BDF8" stroke-width="2" opacity="0.8" filter="url(#glow)">
      <animate attributeName="y1" values="-90;90;-90" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-90;90;-90" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Title & Status HUD Badges -->
  <rect x="50" y="45" width="130" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <circle cx="66" cy="59" r="4" fill="#10B981"/>
  <text x="78" y="63" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">LIVENESS PASS</text>

  <rect x="610" y="45" width="140" height="28" rx="6" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
  <text x="625" y="63" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">FAISS INDEX 512-D</text>

  <text x="50" y="430" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">BioAttend Biometric Engine</text>
  <text x="50" y="455" fill="#94A3B8" font-family="sans-serif" font-size="13">InsightFace Buffalo_L · FAISS Search · EfficientNet-B0 Anti-Spoof</text>
</svg>
