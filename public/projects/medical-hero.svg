<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="medHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#0B1A2C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="650" fill="url(#medHeroBg)" rx="20"/>

  <pattern id="medHeroGrid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="650" fill="url(#medHeroGrid)" rx="20"/>

  <text x="100" y="80" fill="#06B6D4" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">RESEARCH DOMAIN OVERVIEW</text>
  <text x="100" y="115" fill="#FFFFFF" font-family="sans-serif" font-size="32" font-weight="800">Applied Deep Learning & Clinical Intelligence</text>

  <!-- Research Pillars -->
  <g transform="translate(100, 160)">
    <!-- Pillar 1: MRI Segmentation -->
    <rect x="0" y="0" width="310" height="380" rx="16" fill="#0D1322" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="20" fill="rgba(6, 182, 212, 0.15)"/>
    <text x="45" y="52" fill="#06B6D4" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">01</text>
    <text x="80" y="48" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">MRI Diagnostics</text>
    <text x="30" y="95" fill="#94A3B8" font-family="sans-serif" font-size="13">Volumetric anomaly classification with Grad-CAM visual heatmaps for clinical interpretability.</text>
    <rect x="30" y="150" width="250" height="180" rx="8" fill="#070A12" stroke="rgba(6, 182, 212, 0.2)"/>
    <!-- Simulated Heatmap -->
    <circle cx="155" cy="240" r="45" fill="#EC4899" opacity="0.3"/>
    <circle cx="155" cy="240" r="25" fill="#F59E0B" opacity="0.5"/>
    <circle cx="155" cy="240" r="10" fill="#FFFFFF"/>

    <!-- Pillar 2: Nasal Health Chatbot -->
    <rect x="340" y="0" width="310" height="380" rx="16" fill="#0D1322" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
    <circle cx="385" cy="45" r="20" fill="rgba(139, 92, 246, 0.15)"/>
    <text x="385" y="52" fill="#8B5CF6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">02</text>
    <text x="420" y="48" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Health NLP Agent</text>
    <text x="370" y="95" fill="#94A3B8" font-family="sans-serif" font-size="13">Conversational assistant for triage, symptom analysis, and patient guidance across ENT domains.</text>
    <rect x="370" y="150" width="250" height="180" rx="8" fill="#070A12" stroke="rgba(139, 92, 246, 0.2)"/>
    <rect x="390" y="180" width="160" height="30" rx="6" fill="#1E1B4B"/>
    <rect x="440" y="230" width="160" height="30" rx="6" fill="#312E81"/>
    <rect x="390" y="280" width="180" height="30" rx="6" fill="#1E1B4B"/>

    <!-- Pillar 3: Wildfire Remote Sensing -->
    <rect x="680" y="0" width="310" height="380" rx="16" fill="#0D1322" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5"/>
    <circle cx="725" cy="45" r="20" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="725" y="52" fill="#EF4444" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">03</text>
    <text x="760" y="48" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Wildfire Sensing</text>
    <text x="710" y="95" fill="#94A3B8" font-family="sans-serif" font-size="13">Thermal remote imagery and CNN classification for rapid wildfire detection and containment.</text>
    <rect x="710" y="150" width="250" height="180" rx="8" fill="#070A12" stroke="rgba(239, 68, 68, 0.2)"/>
    <circle cx="835" cy="240" r="50" fill="#EF4444" opacity="0.2"/>
    <circle cx="835" cy="240" r="30" fill="#F59E0B" opacity="0.4"/>
    <circle cx="835" cy="240" r="12" fill="#FDE047"/>
  </g>
</svg>
