<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="tmHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#141E33"/>
    </linearGradient>
    <filter id="tmHeroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="650" fill="url(#tmHeroBg)" rx="20"/>

  <!-- Grid -->
  <pattern id="tmHeroGrid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="650" fill="url(#tmHeroGrid)" rx="20"/>

  <text x="100" y="80" fill="#F59E0B" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">SYSTEM ARCHITECTURE</text>
  <text x="100" y="115" fill="#FFFFFF" font-family="sans-serif" font-size="32" font-weight="800">Lahore TravelMate Platform Structure</text>

  <!-- Left Side: Architecture Cards -->
  <g transform="translate(100, 160)">
    <!-- Frontend Layer -->
    <rect x="0" y="0" width="300" height="110" rx="12" fill="#0D1322" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <text x="25" y="38" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="bold">CLIENT INTERACTION</text>
    <text x="25" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Responsive UI & Map Engine</text>
    <text x="25" y="90" fill="#94A3B8" font-family="sans-serif" font-size="13">Interactive itinerary builder & search</text>

    <!-- Connector -->
    <path d="M 300 55 L 380 55" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="380,55 370,50 370,60" fill="#F59E0B"/>

    <!-- API & Security Middleware -->
    <rect x="380" y="0" width="320" height="110" rx="12" fill="#0D1322" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <text x="405" y="38" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">NODE / EXPRESS CORE</text>
    <text x="405" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Hardened Security Layer</text>
    <text x="405" y="90" fill="#94A3B8" font-family="sans-serif" font-size="13">Rate-limiting, Helmet.js & sanitization</text>

    <!-- Database Layer -->
    <rect x="190" y="150" width="300" height="100" rx="12" fill="#0D1322" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
    <text x="215" y="185" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">DATA STORAGE</text>
    <text x="215" y="210" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">GeoJSON & Cultural Catalog</text>
    <text x="215" y="232" fill="#94A3B8" font-family="sans-serif" font-size="13">Indexed points of interest & reviews</text>
  </g>

  <!-- Right Side: Travel Map Graphic -->
  <g transform="translate(900, 300)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="120" fill="rgba(245, 158, 11, 0.05)" filter="url(#tmHeroGlow)"/>

    <!-- Map Nodes -->
    <circle cx="-60" cy="-40" r="14" fill="#0D1322" stroke="#F59E0B" stroke-width="2"/>
    <text x="-60" y="-36" fill="#F59E0B" font-size="10" font-family="monospace" text-anchor="middle">POI 1</text>

    <circle cx="50" cy="-60" r="14" fill="#0D1322" stroke="#10B981" stroke-width="2"/>
    <text x="50" y="-56" fill="#10B981" font-size="10" font-family="monospace" text-anchor="middle">POI 2</text>

    <circle cx="40" cy="50" r="14" fill="#0D1322" stroke="#3B82F6" stroke-width="2"/>
    <text x="40" y="54" fill="#38BDF8" font-size="10" font-family="monospace" text-anchor="middle">POI 3</text>

    <!-- Connecting route -->
    <path d="M -60 -40 L 50 -60 L 40 50 Z" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
</svg>
