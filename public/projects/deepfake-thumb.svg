<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#140E24"/>
      <stop offset="100%" stop-color="#1E1235"/>
    </linearGradient>
    <linearGradient id="dfPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="dfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#dfBg)" rx="16"/>

  <pattern id="dfGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" fill="url(#dfGrid)" rx="16"/>

  <circle cx="400" cy="240" r="140" fill="#A855F7" opacity="0.12" filter="url(#dfGlow)"/>

  <!-- Split Face: Real vs Synthetic Artifacts -->
  <g transform="translate(400, 240)">
    <!-- Dividing Axis Line -->
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#EC4899" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Left Side: Real Face Wireframe (Cyan) -->
    <path d="M 0 -80 C -50 -80 -80 -40 -80 10 C -80 60 -40 90 0 100" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="-35" cy="-20" r="5" fill="#38BDF8" filter="url(#dfGlow)"/>
    <path d="M -50 40 Q -25 55 0 55" fill="none" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Right Side: Deepfake Distortions & Noise (Magenta/Purple) -->
    <path d="M 0 -80 C 55 -75 85 -35 75 15 C 65 65 35 95 0 100" fill="none" stroke="#EC4899" stroke-width="2"/>
    <circle cx="35" cy="-20" r="7" fill="none" stroke="#EC4899" stroke-width="2"/>
    <circle cx="35" cy="-20" r="3" fill="#EC4899"/>
    <!-- Glitch / Artifact boxes -->
    <rect x="20" y="25" width="20" height="15" fill="rgba(236, 72, 153, 0.3)" stroke="#EC4899" stroke-width="1"/>
    <rect x="45" y="45" width="25" height="12" fill="rgba(168, 85, 247, 0.3)" stroke="#A855F7" stroke-width="1"/>

    <!-- Detection Reticles -->
    <rect x="-110" y="-100" width="220" height="200" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="-95" y="-80" fill="#38BDF8" font-family="monospace" font-size="10">REAL (0.02)</text>
    <text x="15" y="-80" fill="#EC4899" font-family="monospace" font-size="10">SYNTHETIC (0.98)</text>
  </g>

  <!-- Badges -->
  <rect x="50" y="45" width="165" height="28" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
  <circle cx="66" cy="59" r="4" fill="#A855F7"/>
  <text x="78" y="63" fill="#C084FC" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">140K KAGGLE DATASET</text>

  <rect x="580" y="45" width="170" height="28" rx="6" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1"/>
  <text x="595" y="63" fill="#F472B6" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">RESNET50 / MOBILENET</text>

  <text x="50" y="430" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">DeepFake Detection System</text>
  <text x="50" y="455" fill="#94A3B8" font-family="sans-serif" font-size="13">Transfer Learning · Artifact Analysis · Face Boundary Verification</text>
</svg>
