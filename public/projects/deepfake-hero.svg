<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="dfHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#120A1E"/>
      <stop offset="100%" stop-color="#1A0D2A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="650" fill="url(#dfHeroBg)" rx="20"/>

  <pattern id="dfHeroGrid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="650" fill="url(#dfHeroGrid)" rx="20"/>

  <text x="100" y="80" fill="#C084FC" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">CLASSIFICATION PIPELINE</text>
  <text x="100" y="115" fill="#FFFFFF" font-family="sans-serif" font-size="32" font-weight="800">DeepFake Detection Architecture & Methodology</text>

  <g transform="translate(100, 160)">
    <!-- Stage 1: Ingestion -->
    <rect x="0" y="0" width="310" height="380" rx="16" fill="#0D1322" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="20" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="45" y="52" fill="#C084FC" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">01</text>
    <text x="80" y="48" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">140k Face Ingestion</text>
    <text x="30" y="95" fill="#94A3B8" font-family="sans-serif" font-size="13">High-resolution preprocessing with facial landmark alignment and color-space artifact extraction.</text>
    <rect x="30" y="155" width="250" height="175" rx="8" fill="#070A12" stroke="rgba(168, 85, 247, 0.2)"/>
    <circle cx="155" cy="240" r="50" fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="105" y1="240" x2="205" y2="240" stroke="#EC4899" stroke-width="2"/>

    <!-- Stage 2: Transfer Learning Backbone -->
    <rect x="340" y="0" width="310" height="380" rx="16" fill="#0D1322" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
    <circle cx="385" cy="45" r="20" fill="rgba(59, 130, 246, 0.15)"/>
    <text x="385" y="52" fill="#60A5FA" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">02</text>
    <text x="420" y="48" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Backbone Fine-Tuning</text>
    <text x="370" y="95" fill="#94A3B8" font-family="sans-serif" font-size="13">Dual evaluation with ResNet50 (deep residual representations) and MobileNetV2 (edge efficiency).</text>
    <rect x="370" y="155" width="250" height="175" rx="8" fill="#070A12" stroke="rgba(59, 130, 246, 0.2)"/>
    <rect x="390" y="180" width="210" height="32" rx="6" fill="#1E293B"/>
    <text x="495" y="201" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">ResNet50 Conv Blocks</text>
    <rect x="390" y="225" width="210" height="32" rx="6" fill="#1E293B"/>
    <text x="495" y="246" fill="#A78BFA" font-family="monospace" font-size="12" text-anchor="middle">MobileNetV2 Inverted Res</text>
    <rect x="390" y="270" width="210" height="32" rx="6" fill="#1E293B"/>
    <text x="495" y="291" fill="#34D399" font-family="monospace" font-size="12" text-anchor="middle">Dense + Dropout Classifier</text>

    <!-- Stage 3: Inference & Confidence -->
    <rect x="680" y="0" width="310" height="380" rx="16" fill="#0D1322" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <circle cx="725" cy="45" r="20" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="725" y="52" fill="#34D399" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">03</text>
    <text x="760" y="48" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Sigmoid Decision</text>
    <text x="710" y="95" fill="#94A3B8" font-family="sans-serif" font-size="13">Calibrated probability scoring with threshold optimization to minimize false positive alarms.</text>
    <rect x="710" y="155" width="250" height="175" rx="8" fill="#070A12" stroke="rgba(16, 185, 129, 0.2)"/>
    <circle cx="835" cy="235" r="45" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="2"/>
    <text x="835" y="235" fill="#34D399" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">0.984</text>
    <text x="835" y="255" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">CONFIDENCE SCORE</text>
  </g>
</svg>
